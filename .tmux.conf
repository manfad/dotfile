# ============================================================================
# TMUX CONFIGURATION
# ============================================================================

# ----------------------------------------------------------------------------
# PREFIX SETTINGS
# ----------------------------------------------------------------------------
set -g prefix C-a
unbind C-b
bind C-a send-prefix  
# ----------------------------------------------------------------------------
# BASIC SETTINGS
# ----------------------------------------------------------------------------
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0
# ----------------------------------------------------------------------------
# PANE NAVIGATION (No prefix needed)
# ----------------------------------------------------------------------------
unbind ,
unbind .
bind = split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind -r , select-pane -t :.-
bind -r . select-pane -t :.+
bind -r < swap-pane -d -t -1
bind -r > swap-pane -d -t +1
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
# ----------------------------------------------------------------------------
# COPY MODE (Vim keys)
# ----------------------------------------------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"
# Enable the system clipboard
set -s set-clipboard on

# Optional: Use vi-style keys in Tmux's own copy mode
set-window-option -g mode-keys vi
# ----------------------------------------------------------------------------
# WINDOW & PANE MANAGEMENT
# ----------------------------------------------------------------------------
# Kill window/pane without confirmation
bind Q kill-window
bind q kill-pane

# New window in current path
bind n new-window -c "#{pane_current_path}"
bind m command-prompt -p "New session name:" "new-session -s '%%'"
bind N command-prompt -I "#W" "rename-window '%%'"  # Ctrl+b m - rename window
bind M command-prompt -I "#S" "rename-session '%%'"  # Ctrl+b M - rename session

# Navigate windows
bind Left previous-window
bind Right next-window

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# ----------------------------------------------------------------------------
# POPUP UTILITIES
# ----------------------------------------------------------------------------

bind S display-popup -E -w 70% -h 70% "~/tmux-session.sh"

bind s display-popup -E -w 70% -h 70% "tmux list-sessions -F '#{session_name}' | fzf --reverse \
 --preview 'tmux list-windows -t {} -F \"  #I: #W #{?window_active,(active),}\"' --preview-window 'right:40%:border-left' --bind 'enter:execute(tmux switch-client -t {})+accept'"
# ----------------------------------------------------------------------------

# Prefix + t: Quick terminal
bind t display-popup -E -w 80% -h 80% -d "#{pane_current_path}" \
    "echo 'Quick Terminal (Ctrl+D to close)'; $SHELL"

# Prefix + !: Run command
bind ! command-prompt -p "Run command:" \
    "display-popup -E -w 80% -h 80% -d '#{pane_current_path}' \
    '%% ; echo \"\" ; echo \"Command finished. Press Enter to close...\" ; read'"

# ----------------------------------------------------------------------------
# FUZZY FINDERS
# ----------------------------------------------------------------------------
# Prefix + f: Search DIRECTORIES
bind f display-popup -E -w 80% -h 80% -d "#{pane_current_path}" \
    "bash -c '
    current_dir=\"#{pane_current_path}\"
    cd \"\$current_dir\"
    
    while true; do
        # We swapped the header descriptions and the --expect keys
        selection=\$(eza -1D --icons | fzf --ansi \
            --preview \"eza -1 --color=always --icons {}\" \
            --preview-window=right:60% \
            --bind \"right:accept\" \
            --bind \"enter:accept+beginning-of-line+kill-line+print(current)\" \
            --bind \"ctrl-e:accept+beginning-of-line+kill-line+print(new-pane)\" \
            --bind \"left:accept+beginning-of-line+kill-line+print(back)\" \
            --expect=enter,ctrl-e,left)
        
        key=\$(echo \"\$selection\" | head -1)
        dir=\$(echo \"\$selection\" | tail -1)
        
        [[ -z \"\$dir\" ]] && break
        
        case \"\$key\" in
            enter)
                # Now Enter maps to the "current" logic
                echo \"current:\$(pwd)/\$dir\"
                break
                ;;
            ctrl-e)
                # Now Ctrl-e maps to the "new-pane" logic
                echo \"new-pane:\$(pwd)/\$dir\"
                break
                ;;
            left)
                cd ..
                ;;
            *)
                if [[ -d \"\$dir\" ]]; then
                    cd \"\$dir\"
                else
                    break
                fi
                ;;
        esac
    done' \
    | while read -r action; do
        case \"\$action\" in
            new-pane:*)
                dir=\"\${action#new-pane:}\"
                tmux split-window -h -c \"\$dir\"
                ;;
            current:*)
                dir=\"\${action#current:}\"
                tmux send-keys \"cd '\$dir'\" Enter
                ;;
        esac
    done"
# File finder with preview
bind i display-popup -E -w 80% -h 80% -d "#{pane_current_path}" \
    'fd --type f --hidden --exclude .git | fzf \
    --preview "bat --color=always --style=numbers --line-range :500 {}" \
    --preview-window=right:60% \
    --bind "enter:execute(tmux split-window -v nvim {})" \
    --bind "ctrl-s:execute(tmux split-window -h nvim {})" \
    --bind "ctrl-e:execute(tmux send-keys \"nvim {}\" Enter)"'


bind-key -T prefix o display-popup -E -d "#{pane_current_path}" -h "80%" -w "80%" "\
fd --type f --hidden --exclude .git | \
eza --color=always --icons=always -1 --stdin | \
fzf --ansi \
    --preview 'bat --color=always --style=numbers --line-range :500 {2..}' \
    --preview-window=right:60% \
    --color='fg:#c0caf5,bg:#1a1b26,hl:#7aa2f7' \
    --color='fg+:#c0caf5,bg+:#292e42,hl+:#7dcfff' \
    --color='info:#7aa2f7,prompt:#7dcfff,pointer:#f7768e' \
    --color='marker:#9ece6a,spinner:#9ece6a,header:#9ece6a' \
    --prompt='📁 ' \
    --pointer='▶' \
    --marker='✓' \
    --bind 'enter:execute(echo new-pane:{2..})' \
    --bind 'ctrl-e:execute(echo current:{2..})' | \
while read -r action; do
  case \"\$action\" in
    new-pane:*)
      file=\"\${action#new-pane:}\"
      dir=\"\$(dirname \"\$file\")\"
      tmux split-window -h -c \"\$dir\" \"nvim '\$file'\"
      ;;
    current:*)
      file=\"\${action#current:}\"
      dir=\"\$(dirname \"\$file\")\"
      tmux send-keys \"cd '\$dir' && nvim '\$file'\" Enter
      ;;
  esac
done"

bind O display-popup -E -d "#{pane_current_path}" -h "80%" -w "80%" -S "bg=black,fg=#7aa2f7" "\
fd --type f --extension md --hidden --exclude .git --color=always | \
fzf --ansi \
    --preview 'glow -s dark -w 80 {}' \
    --preview-window=right:60%:wrap \
    --color='fg:#c0caf5,bg:black,hl:#7aa2f7' \
    --color='fg+:#c0caf5,bg+:#292e42,hl+:#7dcfff' \
    --color='info:#7aa2f7,prompt:#7dcfff,pointer:#f7768e' \
    --color='marker:#9ece6a,spinner:#9ece6a,header:#9ece6a' \
    --prompt='📝 ' \
    --pointer='▶' \
    --marker='✓' \
    --bind 'enter:execute(export LESS=\"-R --mouse --wheel-lines=3\" && glow -s dark -p {})'"


# Shift+Enter sends newline (literal Enter)
bind-key -n S-Enter send-keys C-j
# Claude Code popup
bind c display-popup -E -w 80% -h 85% -d "#{pane_current_path}" \
    'tmux new-session -A -s claude_scratch "claude" \; set status off'

# CC Reader - Markdown viewer popup (prefix + C)
bind C display-popup -E -w 85% -h 90% 'ccreader'
# ----------------------------------------------------------------------------
# AESTHETICS & COLORS (blacklotus + kuroyukihime theme)
# ----------------------------------------------------------------------------
# Colors:
# bg: #0D0D12, purple: #9c27b0, magenta: #FF007C, hotpink: #ff4081
# green: #00ff87, blue: #00bfff, fg_dim: #c4a1ff, grey: #5C5C70

# Status bar
set -g status-style bg=default,fg=#c4a1ff
set -g status-left-length 30
set -g status-left "#[fg=#0D0D12,bg=#9c27b0,bold] #S #[fg=#9c27b0,bg=default] "
set -g status-right ""

# Window status
setw -g window-status-format "#[fg=#5C5C70] #I:#W "
setw -g window-status-current-format "#[fg=#0D0D12,bg=#ff4081,bold] #I:#W #[fg=#ff4081,bg=default]"
setw -g window-status-separator ""

# Pane borders
set -g pane-border-style fg=#5C5C70
set -g pane-active-border-style fg=#9c27b0,bold

# Popup styling
set -g popup-border-lines rounded
set -g popup-border-style fg=#9c27b0

# Message/command styling
set -g message-style bg=#0D0D12,fg=#ff4081,bold
set -g message-command-style bg=#0D0D12,fg=#00ff87

# Copy mode
setw -g mode-style bg=#3A2A4D,fg=#c4a1ff

# ----------------------------------------------------------------------------
# PLUGINS (TPM)
# ----------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'

